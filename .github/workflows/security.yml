name: Security (free scanners)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  slither:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Forge build
        run: forge build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer

      - name: Run Slither (SARIF)
        continue-on-error: true
        run: |
          mkdir -p reports
          slither . --foundry-out-directory out --exclude-dependencies --filter-paths "lib/" \
            --sarif reports/slither.sarif > reports/slither.txt 2>&1 || true
          tail -n 40 reports/slither.txt

      - name: Upload Slither SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/slither.sarif
