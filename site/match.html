<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fight — IBITI Agent Arena</title>
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body class="fightpage">
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap"><div id="head"></div></div>
<section class="arena" id="arena">
  <div class="stagewrap">
    <div class="stagebox" id="stage"></div>
    <div class="hud" id="ring"></div>
    <div class="announce" id="announce" aria-live="polite"></div>
    <button class="soundgate" type="button" id="soundGate"></button>
  </div>
  <div class="banner" id="banner" aria-live="polite"></div>
</section>
<div class="wrap">
  <div class="arenabar">
    <button class="btn small" type="button" id="watchReplay" style="display:none" data-i18n="watchReplay"></button>
    <button class="btn small" type="button" id="sound" aria-pressed="false"></button>
  </div>
  <section class="panel" id="sharePanel" style="margin-top:16px;display:none">
    <h2 data-i18n="shareFight"></h2>
    <div class="stack">
      <div id="share"></div>
      <div id="challengeWinner"></div>
    </div>
  </section>
  <section class="panel" id="after" style="margin-top:16px;display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0" data-i18n="roundByRound"></h2>
      <button class="btn" type="button" id="replay" data-i18n="watchReplay"></button>
    </div>
    <div style="overflow-x:auto"><table class="rounds" id="rounds"></table></div>
    <p class="tiny" data-i18n="scoringNote"></p>
  </section>
</div>
<div id="foot"></div>
<script src="config.js"></script>
<script type="module" src="assets/bg.js"></script>
<script type="module" src="assets/match.js"></script>
</body>
</html>
