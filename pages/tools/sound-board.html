<!doctype html>
<!-- A team tool: every sound of the ring and the ranking, through the site's own sound code, to hear
     them without a live fight. Open it from the local server (http://localhost:8797/pages/tools/sound-board.html). -->
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звуки арены</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 16px 48px; background: #0d0f14; color: #e8e8ee; font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; color: #f2cf6e; }
  h2 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #9aa0ad; margin: 28px 0 10px; }
  p { color: #9aa0ad; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  button { padding: 14px 12px; border-radius: 10px; border: 1px solid #2a2f3a; background: #171a22; color: inherit; font: inherit; cursor: pointer; text-align: left; }
  button:hover { border-color: #f2cf6e; }
  button.big { width: 100%; padding: 18px; font-size: 18px; background: #2a1d0a; border-color: #f2cf6e; color: #f2cf6e; text-align: center; }
  button.on { border-color: #f2cf6e; background: #2a1d0a; }
  #now { min-height: 1.4em; margin-top: 12px; color: #f2cf6e; }
</style>
<main>
  <h1>Звуки арены</h1>
  <p>Каждая кнопка играет звук так же, как на настоящем ринге. «Весь бой» проигрывает их по порядку, примерно за минуту.</p>
  <button class="big" id="fight">▶ Весь бой подряд</button>
  <div id="now"></div>

  <h2>Ринг</h2>
  <div class="grid" id="ring"></div>
  <h2>Музыка боя</h2>
  <div class="grid" id="music"></div>
  <h2>Зал</h2>
  <div class="grid" id="hall"></div>
  <h2>Рейтинг</h2>
  <div class="grid" id="rank"></div>
</main>
<script type="module">
const S = await import('/site/assets/sound.js');
const R = await import('/site/assets/rankfx.js');
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const say = (t) => ($('now').textContent = t);
S.setSound(true); // starts fetching the recordings now; the first touch lets them sound
say('Нажми в любом месте страницы, чтобы включить звук.');

const groups = {
  ring: [
    ['Гонг: начало раунда', () => S.gong()],
    ['Гонг: конец боя', () => S.gong(3)],
    ['Отсчёт: 3, 2', () => S.beep()],
    ['Отсчёт: 1 (последний)', () => S.beep(true)],
    ['Ответ принят', () => S.ding()],
    ['Апперкот', () => S.punch()],
    ['Падение на стол', () => S.crash()],
    ['Приземление после сальто', () => S.land()],
    ['Ловушка (в повторе)', () => S.thud()],
  ],
  music: [
    ['Перед боем и в перерывах', () => S.setMusic('hype')],
    ['Во время раунда', () => S.setMusic('tension')],
    ['Победа: зал ревёт', () => S.setMusic('victory')],
    ['Тишина', () => S.setMusic(null)],
  ],
  hall: [
    ['Гул: спокойный', () => S.crowdLevel(0.2)],
    ['Гул: на ногах', () => S.crowdLevel(1)],
    ['Рёв: маленький', () => S.cheer(0.5)],
    ['Рёв: большой', () => S.cheer(1.5)],
    ['«У-у-у»', () => S.ooh(1, 2)],
    ['«Бу-у-у»', () => S.boo()],
  ],
  rank: [
    ['Строка разбивается', () => R.soundShatter(true)],
    ['Осколки собираются', () => R.soundGather(0)],
    ['Строка встаёт: 1 место', () => R.soundLand(1)],
    ['Строка встаёт: 5 место', () => R.soundLand(5)],
  ],
};
for (const [id, list] of Object.entries(groups)) {
  for (const [label, fn] of list) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => {
      S.setSound(true);
      fn();
      say(label);
    };
    $(id).append(b);
  }
}

// a short fight: countdown, a round with answers, a break, the knockout and the winner
$('fight').onclick = async () => {
  S.setSound(true);
  const steps = [
    [0, 'Перед боем: музыка, зал заводится', () => { S.setMusic('hype'); S.crowdLevel(0.7); }],
    [5000, 'Отсчёт: 3', () => S.beep()],
    [1000, 'Отсчёт: 2', () => S.beep()],
    [1000, 'Отсчёт: 1', () => S.beep(true)],
    [1000, 'Гонг: раунд 1', () => { S.gong(); S.setMusic('tension'); S.crowdLevel(0.4); }],
    [5000, 'Ответ принят, зал радуется', () => { S.ding(); S.cheer(0.8); }],
    [5000, 'Агент попался: «бу-у-у»', () => S.boo()],
    [4000, 'Перерыв', () => { S.setMusic('hype'); S.crowdLevel(0.55); }],
    [6000, 'Гонг: конец боя', () => { S.gong(3); S.setMusic(null); S.crowdLevel(0.5); }],
    [4000, 'Победа: зал ревёт', () => S.setMusic('victory')],
    [5000, 'Проигравший бросается, апперкот', () => { S.punch(); S.ooh(1.1, 1.6); }],
    [2000, 'Падает на стол', () => { S.crash(); S.cheer(1.3); }],
    [4000, 'Победитель на канатах', () => S.cheer(0.5)],
    [3000, 'Сальто', () => S.ooh(1.2, 3.2)],
    [3200, 'Приземление, зал ликует', () => { S.land(); S.cheer(1.5); }],
    [5000, 'Конец', () => S.crowdLevel(0.2)],
  ];
  for (const [wait, label, fn] of steps) {
    await sleep(wait);
    say(label);
    fn();
  }
};
</script>
</html>
