[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
# BSC supports Cancun opcodes (MCOPY, TSTORE) since the Haber hard fork; OpenZeppelin 5.5 needs MCOPY
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[lint]
lint_on_build = false
